<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Amo - Hello Kitty Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, #root {
    background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  #root {
    position: relative;
    width: 100%;
    min-height: 550px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .kitty-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.85);
    border: 4px solid #ff8fab;
    border-radius: 32px;
    box-shadow: 0 16px 32px rgba(255, 143, 171, 0.3);
    backdrop-filter: blur(8px);
    padding: 35px 24px;
    width: min(420px, 90vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
  }

  .kitty-icon-wrap {
    position: relative;
    display: inline-block;
    font-size: 60px;
    line-height: 1;
    margin-bottom: 5px;
    animation: floating 3s ease-in-out infinite;
  }

  @keyframes floating {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(3deg); }
  }

  .word-display {
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .lang-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ff477e;
    opacity: 0;
    animation: fadeLabel 0.5s ease 0.1s forwards;
  }

  .love-word {
    font-size: clamp(26px, 6vw, 44px);
    font-weight: 900;
    color: #ff5c8a;
    text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffe5ec;
    opacity: 0;
    transform: scale(0.8) translateY(10px);
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes popIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeLabel {
    to { opacity: 0.85; }
  }

  .counter {
    font-size: 13px;
    font-weight: 700;
    color: #ff8fab;
    letter-spacing: 0.5px;
  }

  .progress-bar-wrap {
    width: 80%;
    height: 8px;
    background: #fff0f3;
    border: 2px solid #ffb3c6;
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff758f, #ff477e);
    transition: width 0.2s ease-out;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
    justify-content: center;
  }

  .ctrl-btn {
    background: #fff;
    border: 2px solid #ffb3c6;
    color: #ff5c8a;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0px #ffb3c6;
    transition: all 0.1s ease;
  }
  .ctrl-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0px #ffb3c6;
  }
  .ctrl-btn:hover {
    background: #fff0f3;
    border-color: #ff758f;
  }
  .ctrl-btn.active {
    background: #ff477e;
    color: #fff;
    border-color: #ff477e;
    box-shadow: 0 4px 0px #ff0a54;
  }
  .ctrl-btn.active:active {
    box-shadow: 0 1px 0px #ff0a54;
  }

  .floating-hearts {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .fh {
    position: absolute;
    bottom: -50px;
    font-size: 26px;
    opacity: 0;
    animation: floatUp var(--dur) ease-in forwards;
    animation-delay: var(--delay);
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    15%  { opacity: 0.9; }
    85%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateY(-520px) scale(1.3) rotate(var(--rot)); }
  }
</style>
</head>
<body>

<div id="root">
  <canvas id="stars"></canvas>
  <div class="floating-hearts" id="fhearts"></div>
  
  <div class="kitty-card">
    <div class="kitty-icon-wrap">🎀</div>
    
    <div class="word-display">
      <div class="lang-label" id="langLabel">Español Mexicano</div>
      <div class="love-word" id="loveWord">Te amo</div>
    </div>
    
    <div class="counter" id="counter">1 / 300</div>
    
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn">Anterior</button>
      <button class="ctrl-btn active" id="playBtn">⏸ Pausa</button>
      <button class="ctrl-btn" id="nextBtn">Siguiente</button>
    </div>
  </div>
</div>

];

let current = 0;
let playing = true;
let interval = null;
const INTERVAL_MS = 2200;

const langLabel = document.getElementById('langLabel');
const loveWord = document.getElementById('loveWord');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const playBtn = document.getElementById('playBtn');
const fhearts = document.getElementById('fhearts');

function showEntry(i) {
  langLabel.style.animation = 'none';
  loveWord.style.animation = 'none';
  void langLabel.offsetWidth;
  void loveWord.offsetWidth;
  langLabel.textContent = data[i][0];
  loveWord.textContent = data[i][1];
  langLabel.style.animation = 'fadeLabel 0.5s ease 0.1s forwards';
  loveWord.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
  counter.textContent = `${i+1} / ${data.length}`;
  progressFill.style.width = `${((i+1)/data.length)*100}%`;
  if (i % 3 === 0) spawnKittyElements();
}

function spawnKittyElements() {
  const kittyItems = ['🎀','🍎','🐱','💖','✨','💝','🤍'];
  for (let k = 0; k < 6; k++) {
    const el = document.createElement('div');
    el.className = 'fh';
    el.textContent = kittyItems[Math.floor(Math.random()*kittyItems.length)];
    el.style.setProperty('--dur', (3 + Math.random()*2.5) + 's');
    el.style.setProperty('--delay', (k * 0.15) + 's');
    el.style.setProperty('--rot', (Math.random()*70-35) + 'deg');
    el.style.left = (5 + Math.random() * 90) + '%';
    fhearts.appendChild(el);
    setTimeout(() => el.remove(), 5500);
  }
}

function next() {
  current = (current + 1) % data.length;
  showEntry(current);
}

function prev() {
  current = (current - 1 + data.length) % data.length;
  showEntry(current);
}

function startInterval() {
  clearInterval(interval);
  interval = setInterval(next, INTERVAL_MS);
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    playBtn.textContent = '⏸ Pausa';
    playBtn.classList.add('active');
    startInterval();
  } else {
    playBtn.textContent = '▶ Play';
    playBtn.classList.remove('active');
    clearInterval(interval);
  }
}

document.getElementById('prevBtn').onclick = () => { prev(); if(playing) startInterval(); };
document.getElementById('nextBtn').onclick = () => { next(); if(playing) startInterval(); };
playBtn.onclick = togglePlay;

const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  const parent = canvas.parentElement;
  canvas.width = parent.offsetWidth;
  canvas.height = parent.offsetHeight || 550;
  stars = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2 + 0.5,
    a: Math.random(),
    speed: 0.005 + Math.random()*0.01,
    color: Math.random() > 0.5 ? 'rgba(255,255,255,' : 'rgba(255,182,193,'
  }));
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.speed;
    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.a));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `${s.color}${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
drawStars();
showEntry(0);
startInterval();
spawnKittyElements();
</script>
